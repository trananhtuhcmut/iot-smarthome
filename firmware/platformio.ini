; Cấu hình dùng chung cho cả 4 mạch
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

; =========================================================
; MẠCH 1: ESP32-S3 (YoloUNO) - Hub ESP-NOW, Local MQTT, WebServer (T07), OTA (T14)
; =========================================================
[env:yolouno_s3]
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
build_src_filter = -<*> +<s3_hub/>
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit NeoPixel@^1.12.3
    links2004/WebSockets@^2.6.1
; =========================================================
; MẠCH 2: ESP32-WROOM - Relay, Nút bấm, Ánh sáng, Đọc BLE (T03), Gửi ESP-NOW (T06)
; =========================================================
[env:wroom_room]
board = esp32dev
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<wroom_room/>
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0

; ; =========================================================
; ; MẠCH 3: ESP32-C3 Mini - Cảm biến Nhiệt ẩm phát BLE (T03) (hu roi doi mua cai moi lay cai s3 dung tam)
