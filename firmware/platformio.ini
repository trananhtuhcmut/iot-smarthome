; =========================================================
; MẠCH 3: ESP32-S3 N16R8 - Cảm biến Nhiệt ẩm phát BLE (T03)
; =========================================================
[env:ble_env_node]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_src_filter = -<*> +<ble_env_node/>
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14



; =========================================================
; MẠCH 4: ESP32-WROOM + Màn hình 2.8" - LVGL (N03) + ESP-NOW (T06)
; =========================================================
[env:lvgl_panel]
board = esp32dev
build_src_filter = -<*> +<lvgl_panel/>
build_flags =
    -I src/lvgl_panel                      ; Trỏ tới lv_conf.h riêng của màn hình
    -DLV_CONF_INCLUDE_SIMPLE
lib_deps =
    lvgl/lvgl@^8.3.11
    bodmer/TFT_eSPI@^2.5.43
    paulstoffregen/XPT2046_Touchscreen