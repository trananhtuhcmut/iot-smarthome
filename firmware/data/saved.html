<!DOCTYPE html>
<html lang="en" data-theme="slate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings Saved — YoloUNO Local Hub</title>
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('hub_theme') || 'slate');
  </script>
  <style>
/* Theme 1: Rose & Cream (#FFCED8, #FFDDDD, #FFF4DE, #FFE8C4) */
    :root, [data-theme="pastel"] {
          --bg: #f7dfba;
      --card: #FFFFFF;
      --tile: #FFDDDD;
      --border: #FFE8C4;
      --title: #6e3b49;
      --accent: #9e5468;
      --ink: #3b232a;
      --muted: #785861;
      --btn-on-bg: #FFCED8;
      --btn-on-text: #4a202c;
      --btn-off-bg: #d97388;
      --btn-off-text: #ffffff;
      --btn-blue-bg: #FFE8C4;
      --btn-blue-text: #4d3519;
      --btn-gray-bg: #FFDDDD;
      --btn-gray-text: #4a202c;
      --pill-bg: #FFE8C4;
      --pill-text: #4d3519;
      --alert-bg: #FFCED8;
      --alert-border: #d97388;
      --alert-text: #4a202c;
    }

    /* Theme 2: Cyan & Grape (#59C3C3, #52489C, #EBEBEB, #CAD2C5, #84A98C) */
    [data-theme="cyan"] {
      --bg: #dff4fc;
      --card: #FFFFFF;
      --tile: #EBEBEB;
      --border: #CAD2C5;
      --title: #52489C;
      --accent: #84A98C;
      --ink: #1e2438;
      --muted: #556270;
      --btn-on-bg: #59C3C3;
      --btn-on-text: #10252b;
      --btn-off-bg: #52489C;
      --btn-off-text: #ffffff;
      --btn-blue-bg: #84A98C;
      --btn-blue-text: #ffffff;
      --btn-gray-bg: #CAD2C5;
      --btn-gray-text: #1e2438;
      --pill-bg: #CAD2C5;
      --pill-text: #1e2438;
      --alert-bg: #52489C;
      --alert-border: #59C3C3;
      --alert-text: #ffffff;
    }

    /* Theme 3: Peach & Sky (#F4BAA3, #F4F0E2, #A6C8E2, #619DC6) */
    [data-theme="peach"] {
      --bg: #e4f4e2;
      --card: #FFFFFF;
      --tile: #F4F0E2;
      --border: #A6C8E2;
      --title: #163047;
      --accent: #619DC6;
      --ink: #163047;
      --muted: #526D82;
      --btn-on-bg: #619DC6;
      --btn-on-text: #ffffff;
      --btn-off-bg: #F4BAA3;
      --btn-off-text: #4a2016;
      --btn-blue-bg: #A6C8E2;
      --btn-blue-text: #163047;
      --btn-gray-bg: #F4F0E2;
      --btn-gray-text: #163047;
      --pill-bg: #A6C8E2;
      --pill-text: #163047;
      --alert-bg: #F4BAA3;
      --alert-border: #c96a46;
      --alert-text: #4a2016;
    }

/* Theme 4: Modern Slate (Light & Auto Dark Mode) */
    [data-theme="slate"] {
      --bg: #f1f5f9;
      --card: #ffffff;
      --tile: #f8fafc;
      --border: #e2e8f0;
      --title: #0f172a;
      --accent: #2563eb;
      --ink: #0f172a;
      --muted: #64748b;
      --shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
      --btn-on-bg: #16a34a;
      --btn-on-text: #ffffff;
      --btn-off-bg: #dc2626;
      --btn-off-text: #ffffff;
      --btn-blue-bg: #2563eb;
      --btn-blue-text: #ffffff;
      --btn-gray-bg: #334155;
      --btn-gray-text: #ffffff;
      --pill-bg: #e2e8f0;
      --pill-text: #0f172a;
      --alert-bg: #fef2f2;
      --alert-border: #dc2626;
      --alert-text: #991b1b;
    }
@media (prefers-color-scheme: dark) {
      [data-theme="slate"] {
        --bg: #0b1120;
        --card: #1e293b;
        --tile: #0f172a;
        --border: #334155;
        --title: #f8fafc;
        --accent: #60a5fa;
        --ink: #f8fafc;
        --muted: #94a3b8;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
        --pill-bg: #334155;
        --pill-text: #f8fafc;
        --alert-bg: #450a0a;
        --alert-border: #dc2626;
        --alert-text: #fecaca;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 460px;
      margin: 0 auto;
      padding: 22px 16px 36px;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* Header & Theme Switcher */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    h2 {
      font-size: 18.5px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--title);
    }

    .theme-sw {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border: 1.5px solid var(--border);
      padding: 4px 8px;
      border-radius: 999px;
    }

    .sw-dot {
      width: 16px;
      height: 16px;
      padding: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(128, 128, 128, 0.35);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .sw-dot:hover { transform: scale(1.12); }
    .sw-dot.active {
      box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--title);
      transform: scale(1.08);
    }

    /* Card */
    .card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 26px 20px 22px;
      margin-bottom: 14px;
      text-align: center;
      box-shadow: var(--shadow);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .icon-ring {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: var(--tile);
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    h3 {
      font-size: 18px;
      font-weight: 700;
      color: var(--title);
      margin-bottom: 6px;
    }

    .msg {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    /* Status Box & Progress */
    .status-box {
      background: var(--tile);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 18px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }

    .bar-track {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }

    .bar-fill {
      height: 100%;
      width: 100%;
      background: var(--accent);
      border-radius: 999px;
      animation: shrink 5s linear forwards;
    }

    @keyframes shrink {
      from { width: 100%; }
      to { width: 0%; }
    }

    /* Buttons */
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button:not(.sw-dot) {
      width: 100%;
      padding: 11px 14px;
      border: none;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease, background-color 0.25s ease;
    }

    button:not(.sw-dot):hover { filter: brightness(0.95); }
    button:not(.sw-dot):active { transform: scale(0.98); }

    .on { background: var(--btn-on-bg); color: var(--btn-on-text); }
    .gray { background: var(--btn-gray-bg); color: var(--btn-gray-text); }

    a { display: block; text-decoration: none; }

    .footer {
      display: block;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>YoloUNO Local Hub (T07)</h2>
    <div class="theme-sw" title="Switch color palette">
            <button type="button" class="sw-dot" data-t="slate" onclick="setTheme('slate')" style="background:linear-gradient(135deg,#f1f5f9 50%,#0b1120 50%)" aria-label="Modern Slate"></button>

      <button type="button" class="sw-dot" data-t="pastel" onclick="setTheme('pastel')" style="background:linear-gradient(135deg,#FFCED8 50%,#FFE8C4 50%)" aria-label="Rose & Cream"></button>
      <button type="button" class="sw-dot" data-t="cyan" onclick="setTheme('cyan')" style="background:linear-gradient(135deg,#59C3C3 50%,#52489C 50%)" aria-label="Cyan & Grape"></button>
      <button type="button" class="sw-dot" data-t="peach" onclick="setTheme('peach')" style="background:linear-gradient(135deg,#619DC6 50%,#F4BAA3 50%)" aria-label="Peach & Sky"></button>
    </div>
  </div>

  <div class="card">
    <div class="icon-ring">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h3>Settings Saved & Applied</h3>
    <p class="msg">Wi-Fi & MQTT credentials have been stored in NVS. YoloUNO Local Hub is rebooting to apply the new network configuration.</p>

    <div class="status-box">
      <span id="statusText">Returning to dashboard in <strong id="sec">5</strong>s...</span>
      <div class="bar-track"><div class="bar-fill"></div></div>
    </div>

    <div class="btn-row">
      <a href="/"><button type="button" class="on">Dashboard</button></a>
      <a href="/config"><button type="button" class="gray">Settings</button></a>
    </div>
  </div>

  <small class="footer">If Wi-Fi SSID changed, reconnect your device to the new network.</small>

  <script>
    function setTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('hub_theme', t);
      document.querySelectorAll('.sw-dot').forEach(b => b.classList.toggle('active', b.dataset.t === t));
    }
    setTheme(localStorage.getItem('hub_theme') || 'pastel');

    let left = 5;
    const secEl = document.getElementById('sec');
    const timer = setInterval(() => {
      left--;
      if (left <= 0) {
        clearInterval(timer);
        document.getElementById('statusText').textContent = 'Redirecting now...';
        window.location.href = '/';
      } else {
        secEl.textContent = left;
      }
    }, 1000);
  </script>
</body>
</html>
