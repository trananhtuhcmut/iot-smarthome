<!DOCTYPE html>
<html lang="en" data-theme="slate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YoloUNO Local Hub (T07)</title>
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('hub_theme') || 'slate');
  </script>
  <style>
    /* Theme 1: Rose & Cream */
    :root, [data-theme="pastel"] {
      --bg: #f7dfba;
      --card: #FFFFFF;
      --tile: #FFDDDD;
      --border: #FFE8C4;
      --title: #6e3b49;
      --accent: #9e5468;
      --ink: #3b232a;
      --muted: #785861;
      --btn-on-bg: #FFCED8;
      --btn-on-text: #4a202c;
      --btn-off-bg: #d97388;
      --btn-off-text: #ffffff;
      --btn-blue-bg: #FFE8C4;
      --btn-blue-text: #4d3519;
      --btn-gray-bg: #FFDDDD;
      --btn-gray-text: #4a202c;
      --pill-bg: #FFE8C4;
      --pill-text: #4d3519;
      --alert-bg: #FFCED8;
      --alert-border: #d97388;
      --alert-text: #4a202c;
    }

    /* Theme 2: Cyan & Grape */
    [data-theme="cyan"] {
      --bg: #dff4fc;
      --card: #FFFFFF;
      --tile: #EBEBEB;
      --border: #CAD2C5;
      --title: #52489C;
      --accent: #84A98C;
      --ink: #1e2438;
      --muted: #556270;
      --btn-on-bg: #59C3C3;
      --btn-on-text: #10252b;
      --btn-off-bg: #52489C;
      --btn-off-text: #ffffff;
      --btn-blue-bg: #84A98C;
      --btn-blue-text: #ffffff;
      --btn-gray-bg: #CAD2C5;
      --btn-gray-text: #1e2438;
      --pill-bg: #CAD2C5;
      --pill-text: #1e2438;
      --alert-bg: #52489C;
      --alert-border: #59C3C3;
      --alert-text: #ffffff;
    }

    /* Theme 3: Peach & Sky */
    [data-theme="peach"] {
      --bg: #e4f4e2;
      --card: #FFFFFF;
      --tile: #F4F0E2;
      --border: #A6C8E2;
      --title: #163047;
      --accent: #619DC6;
      --ink: #163047;
      --muted: #526D82;
      --btn-on-bg: #619DC6;
      --btn-on-text: #ffffff;
      --btn-off-bg: #F4BAA3;
      --btn-off-text: #4a2016;
      --btn-blue-bg: #A6C8E2;
      --btn-blue-text: #163047;
      --btn-gray-bg: #F4F0E2;
      --btn-gray-text: #163047;
      --pill-bg: #A6C8E2;
      --pill-text: #163047;
      --alert-bg: #F4BAA3;
      --alert-border: #c96a46;
      --alert-text: #4a2016;
    }

    /* Theme 4: Modern Slate (Light & Auto Dark Mode) */
    [data-theme="slate"] {
      --bg: #f1f5f9;
      --card: #ffffff;
      --tile: #f8fafc;
      --border: #e2e8f0;
      --title: #0f172a;
      --accent: #2563eb;
      --ink: #0f172a;
      --muted: #64748b;
      --shadow: 0 4px 16px -2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
      --btn-on-bg: #16a34a;
      --btn-on-text: #ffffff;
      --btn-off-bg: #dc2626;
      --btn-off-text: #ffffff;
      --btn-blue-bg: #2563eb;
      --btn-blue-text: #ffffff;
      --btn-gray-bg: #334155;
      --btn-gray-text: #ffffff;
      --pill-bg: #e2e8f0;
      --pill-text: #0f172a;
      --alert-bg: #fef2f2;
      --alert-border: #dc2626;
      --alert-text: #991b1b;
    }
    @media (prefers-color-scheme: dark) {
      [data-theme="slate"] {
        --bg: #0b1120;
        --card: #1e293b;
        --tile: #0f172a;
        --border: #334155;
        --title: #f8fafc;
        --accent: #60a5fa;
        --ink: #f8fafc;
        --muted: #94a3b8;
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
        --pill-bg: #334155;
        --pill-text: #f8fafc;
        --alert-bg: #450a0a;
        --alert-border: #dc2626;
        --alert-text: #fecaca;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 460px;
      margin: 0 auto;
      padding: 22px 16px 36px;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* Header & Theme Switcher */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    h2 {
      font-size: 18.5px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--title);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .theme-sw {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border: 1.5px solid var(--border);
      padding: 4px 8px;
      border-radius: 999px;
    }

    .sw-dot {
      width: 16px;
      height: 16px;
      padding: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(128, 128, 128, 0.35);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .sw-dot:hover { transform: scale(1.12); }
    .sw-dot.active {
      box-shadow: 0 0 0 2px var(--card), 0 0 0 3.5px var(--title);
      transform: scale(1.08);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 11px;
      border-radius: 999px;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Alert Banner */
    .alert {
      display: none;
      background: var(--alert-bg);
      border-left: 5px solid var(--alert-border);
      color: var(--alert-text);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .alert::before { content: "\26A0  "; }

    /* Cards */
    .card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 6px 18px -4px rgba(0, 0, 0, 0.05);
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .card-title {
      display: block;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .card-head .card-title {
      margin-bottom: 0;
    }

    /* Link Status Chips (ESP-NOW & BLE) */
    .conn-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }

    .conn-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--tile);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .conn-val {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-weight: 700;
      font-size: 11.5px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
    }

    .dot.ok  { background: #16a34a; box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.2); }
    .dot.err { background: #dc2626; box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.2); }

    /* Sensor 2x2 Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .tile {
      background: var(--tile);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .tile-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .tile-label svg { stroke: var(--accent); }

    .tile strong {
      display: block;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    /* Chart */
    .legend {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
    }

    .leg-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .leg-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .chart-wrap {
      background: var(--tile);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 8px 6px;
    }

    #envChart {
      width: 100%;
      height: 185px;
      display: block;
    }

    /* Control Row */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--tile);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    .row strong {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 11px;
      border-radius: 999px;
      background: var(--pill-bg);
      color: var(--pill-text);
      letter-spacing: 0.04em;
    }

    /* Buttons */
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button:not(.sw-dot) {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease, opacity 0.2s ease, background-color 0.25s ease;
    }

    button:not(.sw-dot):hover:not(:disabled) { filter: brightness(0.95); }
    button:not(.sw-dot):active:not(:disabled) { transform: scale(0.98); }
    button:not(.sw-dot):disabled { opacity: 0.45; cursor: not-allowed; }

    .on { background: var(--btn-on-bg); color: var(--btn-on-text); }
    .off { background: var(--btn-off-bg); color: var(--btn-off-text); }
    .blue { background: var(--btn-blue-bg); color: var(--btn-blue-text); }
    .gray {
      background: var(--btn-gray-bg);
      color: var(--btn-gray-text);
      border-color: var(--border) !important;
    }

    a { display: block; text-decoration: none; }

    small {
      display: block;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 16px;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>YoloUNO Local Hub (T07)</h2>
    <div class="header-right">
      <div class="theme-sw" title="Switch color palette">
        <button type="button" class="sw-dot" data-t="slate" onclick="setTheme('slate')" style="background:linear-gradient(135deg,#f1f5f9 50%,#0b1120 50%)" aria-label="Modern Slate"></button>
        <button type="button" class="sw-dot" data-t="pastel" onclick="setTheme('pastel')" style="background:linear-gradient(135deg,#FFCED8 50%,#FFE8C4 50%)" aria-label="Rose & Cream"></button>
        <button type="button" class="sw-dot" data-t="cyan" onclick="setTheme('cyan')" style="background:linear-gradient(135deg,#59C3C3 50%,#52489C 50%)" aria-label="Cyan & Grape"></button>
        <button type="button" class="sw-dot" data-t="peach" onclick="setTheme('peach')" style="background:linear-gradient(135deg,#619DC6 50%,#F4BAA3 50%)" aria-label="Peach & Sky"></button>
      </div>
      <div id="netBadge" class="badge" style="background:#64748b">Loading...</div>
    </div>
  </div>

  <div id="alertBox" class="alert"></div>

  <div class="card">
    <b class="card-title">Bedroom Sensors & Links</b>

    <div class="conn-bar">
      <div class="conn-chip">
        <span>ESP-NOW</span>
        <span class="conn-val"><span id="espNowDot" class="dot err"></span><span id="espNowTxt">Offline</span></span>
      </div>
      <div class="conn-chip">
        <span>BLE (C3)</span>
        <span class="conn-val"><span id="bleDot" class="dot err"></span><span id="bleTxt">Offline</span></span>
      </div>
    </div>

    <div class="grid">
      <div class="tile">
        <div class="tile-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>
          <span>Temperature</span>
        </div>
        <strong id="temp">--.- °C</strong>
      </div>

      <div class="tile">
        <div class="tile-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
          <span>Humidity</span>
        </div>
        <strong id="hum">--.- %</strong>
      </div>

      <div class="tile">
        <div class="tile-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <span>Light</span>
        </div>
        <strong id="light">-- / 1000</strong>
      </div>

      <div class="tile">
        <div class="tile-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          <span>ESP-NOW Packet</span>
        </div>
        <strong id="seq">Offline</strong>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <b class="card-title">Temp & Humidity Trend</b>
      <div class="legend">
        <span class="leg-item"><span class="leg-dot" style="background:#ef4444"></span>Temp (°C)</span>
        <span class="leg-item"><span class="leg-dot" style="background:#3b82f6"></span>Humi (%)</span>
      </div>
    </div>
    <div class="chart-wrap">
      <canvas id="envChart"></canvas>
    </div>
  </div>

  <div class="card">
    <b class="card-title">Local Control (ESP-NOW)</b>
    <div class="row"><span>Bedroom Light</span><strong id="relayText">OFFLINE</strong></div>
    <div class="btn-row">
      <button id="btnToggle" class="on" onclick="sendAction('/api/toggle')" disabled>Turn On Light</button>
      <button id="btnAway" class="blue" onclick="sendAction('/api/away')" disabled>Enable Away Mode</button>
    </div>
  </div>

  <div class="card">
    <b class="card-title">System & Network</b>
    <a href="/config"><button class="gray">Wi-Fi & MQTT Settings</button></a>
  </div>

  <small id="metaInfo">FW: ---</small>

  <script>
    let lastHistTemp = [];
    let lastHistHum  = [];
    let isBusyAction = false;

    function setTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('hub_theme', t);
      document.querySelectorAll('.sw-dot').forEach(b => b.classList.toggle('active', b.dataset.t === t));
      drawChart(lastHistTemp, lastHistHum);
    }

    function drawChart(temps, hums) {
      const canvas = document.getElementById('envChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;

      canvas.width  = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const W = rect.width;
      const H = rect.height;
      const cs = getComputedStyle(document.documentElement);
      const borderColor = cs.getPropertyValue('--border').trim() || '#cbd5e1';
      const mutedColor  = cs.getPropertyValue('--muted').trim()  || '#64748b';

      ctx.clearRect(0, 0, W, H);

      const n = Math.min(temps.length, hums.length);
      if (n < 2) {
        ctx.fillStyle = mutedColor;
        ctx.font = '600 12.5px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Waiting for BLE sensor samples...', W / 2, H / 2);
        return;
      }

      const padL = 34, padR = 34, padT = 14, padB = 20;
      const plotW = W - padL - padR;
      const plotH = H - padT - padB;

      // Auto-scale mềm cho trục Nhiệt độ (trái) và Độ ẩm (phải)
      let tMin = Math.floor(Math.min(...temps) - 2);
      let tMax = Math.ceil(Math.max(...temps) + 2);
      if (tMax - tMin < 6) { tMin -= 2; tMax += 2; }

      let hMin = Math.max(0, Math.floor((Math.min(...hums) - 5) / 5) * 5);
      let hMax = Math.min(100, Math.ceil((Math.max(...hums) + 5) / 5) * 5);
      if (hMax - hMin < 15) {
        hMin = Math.max(0, hMin - 5);
        hMax = Math.min(100, hMax + 5);
      }

      // Vẽ lưới ngang & nhãn 2 trục Y
      const steps = 3;
      ctx.font = '600 10.5px system-ui, sans-serif';
      ctx.textBaseline = 'middle';
      for (let i = 0; i <= steps; i++) {
        const y = padT + (plotH * i) / steps;

        ctx.strokeStyle = borderColor;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(W - padR, y);
        ctx.stroke();

        const tVal = tMax - ((tMax - tMin) * i) / steps;
        ctx.fillStyle = '#ef4444';
        ctx.textAlign = 'right';
        ctx.fillText(tVal.toFixed(0) + '°', padL - 5, y);

        const hVal = hMax - ((hMax - hMin) * i) / steps;
        ctx.fillStyle = '#3b82f6';
        ctx.textAlign = 'left';
        ctx.fillText(hVal.toFixed(0) + '%', W - padR + 5, y);
      }

      const xAt = (i) => padL + (plotW * i) / (n - 1);
      const yTemp = (v) => padT + plotH * (1 - (v - tMin) / (tMax - tMin));
      const yHum  = (v) => padT + plotH * (1 - (v - hMin) / (hMax - hMin));

      // Hàm vẽ 1 đường kèm vùng phủ mờ nhẹ
      function plotSeries(values, yFn, strokeHex, fillRgba) {
        ctx.beginPath();
        for (let i = 0; i < n; i++) {
          const x = xAt(i), y = yFn(values[i]);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.strokeStyle = strokeHex;
        ctx.lineWidth = 2.2;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.stroke();

        // Đổ bóng nhẹ phía dưới
        ctx.lineTo(xAt(n - 1), padT + plotH);
        ctx.lineTo(xAt(0), padT + plotH);
        ctx.closePath();
        ctx.fillStyle = fillRgba;
        ctx.fill();

        // Chấm tròn ở điểm mới nhất
        const lx = xAt(n - 1), ly = yFn(values[n - 1]);
        ctx.beginPath();
        ctx.arc(lx, ly, 3.6, 0, Math.PI * 2);
        ctx.fillStyle = strokeHex;
        ctx.fill();
      }

      plotSeries(hums,  yHum,  '#3b82f6', 'rgba(59, 130, 246, 0.10)');
      plotSeries(temps, yTemp, '#ef4444', 'rgba(239, 68, 68, 0.10)');

      // Nhãn trục X gọn phía dưới
      ctx.fillStyle = mutedColor;
      ctx.font = '600 10px system-ui, sans-serif';
      ctx.textBaseline = 'top';
      ctx.textAlign = 'left';
      ctx.fillText('Older', padL, padT + plotH + 5);
      ctx.textAlign = 'right';
      ctx.fillText('Now (' + n + ' pts)', W - padR, padT + plotH + 5);
    }

    function setLinkStatus(dotId, txtId, isOnline) {
      const dot = document.getElementById(dotId);
      const txt = document.getElementById(txtId);
      dot.className = 'dot ' + (isOnline ? 'ok' : 'err');
      txt.textContent = isOnline ? 'Online' : 'Offline';
    }

    async function refreshStatus() {
      try {
        const res = await fetch('/api/status', { cache: 'no-store' });
        if (!res.ok) return;
        const d = await res.json();

        const badge = document.getElementById('netBadge');
        badge.textContent = d.net_banner;
        badge.style.background = d.badge_color;

        const alertBox = document.getElementById('alertBox');
        if (d.alert_code && d.alert_code !== 0) {
          alertBox.textContent = 'ALERT: ' + d.alert_msg;
          alertBox.style.display = 'block';
        } else {
          alertBox.style.display = 'none';
        }

        const espNowOnline = !!d.espnow_online;
        const bleOnline    = espNowOnline && !!d.ble_online;

        setLinkStatus('espNowDot', 'espNowTxt', espNowOnline);
        setLinkStatus('bleDot',    'bleTxt',    bleOnline);

        document.getElementById('temp').textContent  = bleOnline ? (d.temperature.toFixed(1) + ' °C') : '--.- °C';
        document.getElementById('hum').textContent   = bleOnline ? (d.humidity.toFixed(1) + ' %')     : '--.- %';
        document.getElementById('light').textContent = espNowOnline ? (d.light_lux + ' / 1000')       : '-- / 1000';
        document.getElementById('seq').textContent   = espNowOnline ? ('#' + d.last_rx_seq)           : 'Offline';

        const btnToggle = document.getElementById('btnToggle');
        const btnAway   = document.getElementById('btnAway');

        if (!espNowOnline) {
          document.getElementById('relayText').textContent = 'OFFLINE';
          btnToggle.disabled = true;
          btnAway.disabled   = true;
        } else {
          document.getElementById('relayText').textContent = d.relay_on ? 'ON' : 'OFF';
          btnToggle.textContent = d.relay_on ? 'Turn Off Light' : 'Turn On Light';
          btnToggle.className   = d.relay_on ? 'off' : 'on';
          btnAway.textContent   = d.away_mode ? 'Disable Away Mode' : 'Enable Away Mode';
          if (!isBusyAction) {
            btnToggle.disabled = false;
            btnAway.disabled   = false;
          }
        }

        if (Array.isArray(d.hist_temp) && Array.isArray(d.hist_hum)) {
          lastHistTemp = d.hist_temp;
          lastHistHum  = d.hist_hum;
          drawChart(lastHistTemp, lastHistHum);
        }

        document.getElementById('metaInfo').textContent = `FW: ${d.fw_version} | Wi-Fi Ch: ${d.channel} | MAC: ${d.mac}`;
      } catch (e) {
        console.error(e);
      }
    }

    async function sendAction(url) {
      isBusyAction = true;
      document.getElementById('btnToggle').disabled = true;
      document.getElementById('btnAway').disabled   = true;
      try {
        await fetch(url, { method: 'POST', body: '', cache: 'no-store' });
        await new Promise(r => setTimeout(r, 120));
        await refreshStatus();
      } catch (e) {
        console.error(e);
      } finally {
        isBusyAction = false;
        refreshStatus();
      }
    }

    setTheme(localStorage.getItem('hub_theme') || 'slate');
    window.addEventListener('resize', () => drawChart(lastHistTemp, lastHistHum));

    refreshStatus();
    setInterval(refreshStatus, 2000);
  </script>
</body>
</html>
